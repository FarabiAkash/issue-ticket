{% if status == "open" %}
  <span class="badge bg-blue-lt">{{ label }}</span>
{% elif status == "in_progress" %}
  <span class="badge bg-yellow-lt">{{ label }}</span>
{% elif status == "waiting" %}
  <span class="badge bg-orange-lt">{{ label }}</span>
{% elif status == "resolved" %}
  <span class="badge bg-green-lt">{{ label }}</span>
{% else %}
  <span class="badge bg-secondary-lt">{{ label }}</span>
{% endif %}
