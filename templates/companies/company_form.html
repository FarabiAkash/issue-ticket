{% extends "base.html" %}
{% block title %}New company · Issue Ticket{% endblock %}
{% block heading %}New company{% endblock %}
{% block content %}
<div class="row row-cards">
  <div class="col-lg-8">
    <form method="post" class="card" novalidate>
      <div class="card-header">
        <div>
          <h2 class="card-title">Company and first admin</h2>
          <p class="card-subtitle">This also creates the first company admin.</p>
        </div>
      </div>
      <div class="card-body">
        {% csrf_token %}
        {% include "partials/form_fields.html" %}
      </div>
      <div class="card-footer">
        <div class="btn-list">
          <button class="btn btn-primary" type="submit">Create company</button>
          <a class="btn" href="{% url 'company_list' %}">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
