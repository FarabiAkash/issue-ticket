{% extends "base.html" %}
{% block title %}New company · Issue Ticket{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <h1 class="h3 mb-3">New company</h1>
    <p class="text-secondary">This also creates the first company admin.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "partials/form_fields.html" %}
      <button class="btn btn-primary" type="submit">Create company</button>
      <a class="btn btn-link" href="{% url 'company_list' %}">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
