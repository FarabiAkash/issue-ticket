{% extends "base.html" %}
{% block title %}{{ page_title }} · Issue Ticket{% endblock %}
{% block heading %}{{ page_title }}{% endblock %}
{% block content %}
<div class="row row-cards">
  <div class="col-lg-8">
    <form method="post" class="card" novalidate>
      <div class="card-body">
        {% csrf_token %}
        {% if seat_summary %}
          <p class="text-secondary">{{ seat_summary }}</p>
        {% endif %}
        {% include "partials/form_fields.html" %}
      </div>
      <div class="card-footer">
        <div class="btn-list">
          <button class="btn btn-primary" type="submit">Save</button>
          <a class="btn" href="{{ cancel_url }}">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
